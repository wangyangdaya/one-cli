[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-mcp-server"
version = "0.1.0"
description = "Dual-era MCP SQL demo backed by Wren and PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]==2.0.0",
  "pydantic-settings>=2",
  "sqlglot>=29",
  "wrenai[postgres]>=0.13.2",
]

[project.scripts]
sql-mcp-server = "sql_mcp_server.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sql_mcp_server"]

[tool.hatch.build.targets.wheel.force-include]
"app/sql-explorer.html" = "sql_mcp_server/app/sql-explorer.html"
"demo-wren" = "sql_mcp_server/demo-wren"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires an explicitly configured PostgreSQL test database",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "PLC"]

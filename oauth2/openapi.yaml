openapi: 3.0.3
info:
  title: Feishu OAuth Login Validation API
  version: 0.1.0
  description: |
    用于验证 one-cli 飞书 OAuth 2.0 Authorization Code 登录与刷新流程。
    Token 由本地 broker 换取，业务请求直接发送至飞书开放平台。
servers:
  - url: https://open.feishu.cn
tags:
  - name: identity
paths:
  /open-apis/authen/v1/user_info:
    get:
      tags: [identity]
      operationId: getUserInfo
      summary: 获取当前飞书登录用户信息
      security:
        - userOAuth: []
      responses:
        "200":
          description: 飞书用户信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      open_id:
                        type: string
                      union_id:
                        type: string
                      name:
                        type: string
                      tenant_key:
                        type: string
components:
  securitySchemes:
    userOAuth:
      type: oauth2
      description: 飞书用户授权码登录；App Secret 只保存在本地 broker。
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.feishu.cn/open-apis/authen/v1/authorize
          tokenUrl: http://127.0.0.1:18080/oauth/token
          scopes:
            offline_access: 持续访问已授权数据并获取 refresh_token

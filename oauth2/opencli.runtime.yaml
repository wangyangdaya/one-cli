base_url: http://127.0.0.1:18080

auth:
  type: oidc
  issuer: http://127.0.0.1:18080
  client_id: one-cli-demo
  audience: demo-api
  scopes:
    - openid
    - profile
    - expense:read:self
    - expense:submit:self
  redirect:
    type: loopback
    path: /oauth/callback
  token_store: os_keychain

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>one-cli 本地授权</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 20px; color: #18212f; }
      form { display: grid; gap: 14px; }
      input { box-sizing: border-box; width: 100%; padding: 10px; }
      .scopes { background: #f3f6fa; padding: 14px 28px; }
      .error { color: #b42318; }
      .actions { display: flex; gap: 12px; }
      button { padding: 10px 18px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>授权 one-cli 访问个人数据</h1>
    <p>客户端：<strong>{{ client_id }}</strong></p>
    <p>申请权限：</p>
    <ul class="scopes">
      {% for scope in scopes %}<li>{{ scope }}</li>{% endfor %}
    </ul>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/oauth/authorize">
      {% for key, value in values.items() %}
        {% if key not in ["username", "password", "decision"] %}
          <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endif %}
      {% endfor %}
      <label>用户名 <input name="username" autocomplete="username" required></label>
      <label>密码 <input name="password" type="password" autocomplete="current-password" required></label>
      <div class="actions">
        <button type="submit" name="decision" value="allow">登录并授权</button>
        <button type="submit" name="decision" value="deny">拒绝</button>
      </div>
    </form>
  </body>
</html>
